name: Weekly report HWP checks
on:
  push:
    paths: ['weekly-hwp.js', 'weekly-report.js', 'weekly-report.html', 'test/weekly-*', 'test/validate-weekly-hwp.py', '.github/workflows/weekly-report-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check weekly-report.js && node --check office-layout.js && node test/weekly-hwp.cjs
      - run: python -m pip install olefile==0.47 six==1.17.0 git+https://github.com/mete0r/pyhwp.git@83239f0d3bdf438b2c9f7dcff455a6e841154a39
      - run: sudo apt-get update -qq && sudo apt-get install -y libxml2-utils
      - run: python test/validate-weekly-hwp.py
      - name: Inspect HWP metadata with independent parser
        run: python -c "from hwp5.filestructure import Hwp5File; f=Hwp5File('test-output/weekly.hwp'); print(f.summaryinfo.getPropertySetStream())"
      - name: Parse with independent HWP parser
        run: hwp5proc xml test-output/weekly.hwp > test-output/weekly.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-weekly-hwp-validation
          path: test-output/
          retention-days: 3
